spring:
  application:
    name: hiddenwhite-server
  # 本地默认走 dev（开启 SQL 日志）；生产用环境变量 SPRING_PROFILES_ACTIVE=prod 覆盖
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 小程序端与管理端共用 hidden_white 单库；可用环境变量覆盖
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:hidden_white}?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    # 口令不给默认值：base 配置对所有 profile 生效，若在这里留一个 123456，
    # 生产环境忘记注入 DB_PASSWORD 时会「静默地用开发口令连上生产库」——
    # 那是最难发现的一类事故。留空则连接直接失败，问题在启动时就暴露。
    # 本地开发的默认口令见 application-dev.yml。
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      data-source-properties:
        connectionTimeZone: ${DB_TIMEZONE:+08:00}
        forceConnectionTimeZoneToSession: true
  sql:
    init:
      mode: never
  servlet:
    multipart:
      # 容器层上限须略大于业务上限（hiddenwhite.image.max-bytes），
      # 否则超过容器限制的请求会在进入业务校验前就被截断，
      # 运营者只会看到笼统的「上传失败」而不是「图片太大」。
      max-file-size: 12MB
      max-request-size: 16MB

server:
  port: ${SERVER_PORT:8080}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    call-setters-on-nulls: true
    # 日志实现统一交给 Slf4j（由 Spring Boot 日志体系管控）；
    # dev profile 会用 StdOutImpl 覆盖，见 application-dev.yml
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  configuration-properties:
    # 咖啡业务表所在库名占位（CoffeeMapper 中以 ${coffeeDb} 引用）
    coffeeDb: ${COFFEE_DB_NAME:hidden_white}

logging:
  level:
    root: info
    com.hiddenwhite: info

hiddenwhite:
  jwt:
    # 生产环境务必通过环境变量 JWT_SECRET 覆盖；默认值仅供本地开发
    secret: ${JWT_SECRET:dev-only-0123456789abcdef0123456789abcdef}
    expires-seconds: ${JWT_EXPIRES_SECONDS:7200}

  # ===================================================================
  # 图片上传与处理
  # -------------------------------------------------------------------
  # 列表图与详情图各自独立配置目标宽高与缩放方式：
  #   mode = cover   居中裁剪，铺满目标框（不留白边）
  #   mode = contain 等比缩放，完整保留原图
  #
  # ⚠️ 目标比例必须对齐点单端的展示容器，否则前端 aspectFill 会再裁一次，
  #    服务端这次裁剪就白做了（等于二次裁剪，主体更容易被切掉）。
  #    容器实测比例（HiddenWhite-front）：
  #      列表图 .product-media  宽 271rpx × 高 230rpx → 约 1.18:1
  #      详情图 .detail-hero    宽 750rpx × 高 398rpx → 约 1.88:1
  #    预置静态图（static/coffee/*.png）也是按这两个比例做的，
  #    下面的取值与之对齐，上传图与预置图在页面上观感一致。
  # ===================================================================
  image:
    # 上传文件落盘目录（相对路径以进程工作目录为基准）
    upload-dir: ${IMAGE_UPLOAD_DIR:./data/uploads}
    # 单张图片大小上限（字节），默认 10MB
    max-bytes: 10485760
    # 列表图：与 .product-media 容器比例一致（284:240 ≈ 1.183:1）
    list:
      width: 284
      height: 240
      mode: cover
    # 详情图：与 .detail-hero 容器比例一致（1200:636 ≈ 1.887:1）
    detail:
      width: 1200
      height: 636
      mode: cover

  pay:
    # ===================================================================
    # 微信支付接入配置
    # -------------------------------------------------------------------
    # 当前处于「接入层已就绪、凭据未持有」状态：enabled=false 时点单端
    # 会拿到明确的下单失败提示，而不是静默假装下单成功。
    #
    # 沙箱与正式环境的差异：
    #   - 沙箱 gateway：https://api.mch.weixin.qq.com/sandboxnew/pay/unifiedorder
    #     正式 gateway：https://api.mch.weixin.qq.com/pay/unifiedorder
    #   - 沙箱使用专用的 mch_id / api_key / appid，且交易额需在规定范围内
    #   - 沙箱的 JSAPI 唤起需用沙箱专用 appid 的小程序
    # 切换环境只需改 sandbox 与三组凭据，不必改代码。
    #
    # ⚠️ 凭据一律走环境变量，禁止提交到仓库。
    # ===================================================================
    enabled: ${WECHAT_PAY_ENABLED:false}
    sandbox: ${WECHAT_PAY_SANDBOX:true}
    mch-id: ${WECHAT_PAY_MCH_ID:}
    api-key: ${WECHAT_PAY_API_KEY:}
    app-id: ${WECHAT_PAY_APP_ID:}
    notify-url: ${WECHAT_PAY_NOTIFY_URL:https://your-domain.example.com/api/pay/notify}
    # 统一下单时声明的商户订单号前缀，便于与业务订单号区分与对账
    order-prefix: ${WECHAT_PAY_ORDER_PREFIX:HW}
    # -------------------------------------------------------------------
    # 开发模式：跳过真实支付，下单直接置为 PAID。
    # ⚠️ 仅供本地开发跑通「下单→制作中→已取餐」流程，绝不可用于生产。
    #    非 dev profile 下开启会直接阻断应用启动（见 PayDevModeGuard）。
    #    本地开启：设环境变量 HW_PAY_DEV_MODE=true
    # -------------------------------------------------------------------
    dev-mode: ${HW_PAY_DEV_MODE:false}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
