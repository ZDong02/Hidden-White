# =====================================================================
# 隐白咖啡 · 公网单入口反向代理
# ---------------------------------------------------------------------
# 拓扑：
#   客户端（H5 / 微信小程序 / 管理端浏览器）
#        │  https://coffee.example.com
#        ▼
#   nginx（本文件）── 静态站点：点单端 / 、管理端 /admin/
#        │           接口入口：/api/ 、/uploads/
#        │           注入 X-HW-Gateway 共享密钥 + 限流 + 默认拒绝
#        ▼  127.0.0.1:8080（只有本机能连）
#   HiddenWhite-backend
#
# 后端侧配套（缺一不可）：
#   SPRING_PROFILES_ACTIVE=prod
#   SERVER_ADDRESS=127.0.0.1          ← 绑回环，外部连不到 8080
#   HW_GATEWAY_SECRET=<与本文件 $hw_gateway_secret 相同>
#
# 站点根目录布局（一个 root 服务两个前端，避免 alias + try_files 的坑）：
#   /var/www/hiddenwhite/            ← 点单端：npm run build:h5 的 dist/build/h5 内容
#   /var/www/hiddenwhite/admin/      ← 管理端：npm run build 的 dist 内容
#
# 部署位置：/etc/nginx/conf.d/hiddenwhite.conf
# 校验：sudo nginx -t && sudo systemctl reload nginx
# =====================================================================

# ---------------------------------------------------------------------
# 限流区（http 上下文；本文件被 include 在 http{} 下可直接使用）
#
# hw_auth：认证入口。30 次/分钟 ≈ 一次冷启动 1 张验证码 + 几次手误，
#          对真人足够，对密码爆破远远不够。与后端 RateLimitFilter 组成双闸：
#          这里是第一道（省掉 TCP 与业务开销），后端那道防「绕过 nginx 的内网来源」。
# hw_api：业务接口。300 次/分钟覆盖正常点单（首屏 3~5 个请求 + 切 Tab），
#         但挡住脚本扫接口。
# ---------------------------------------------------------------------
limit_req_zone $binary_remote_addr zone=hw_auth:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=hw_api:10m rate=300r/m;

# 后端地址集中在这里：换机器/换端口只改这一行
upstream hiddenwhite_backend {
    server 127.0.0.1:8080 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# 80 → 443：小程序与 H5 都要求 https
server {
    listen 80;
    listen [::]:80;
    server_name coffee.example.com;

    # 保留 ACME 续期路径，其余一律跳转
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name coffee.example.com;

    ssl_certificate     /etc/letsencrypt/live/coffee.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/coffee.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:HW_SSL:10m;
    ssl_session_timeout 1d;

    # 不对外暴露 nginx 版本号
    server_tokens off;

    # -----------------------------------------------------------------
    # 安全响应头（server 级）。
    # 注意：nginx 的 add_header 不继承 —— 只要某个 location 里出现了
    # add_header，本段就不再对那个 location 生效。所以凡是自己写了
    # add_header 的 location（/api/ 与认证入口），都把这几行抄了一遍。
    # 静态资源的缓存改用 expires 指令（不触发上述规则）。
    # -----------------------------------------------------------------
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # 与后端 spring.servlet.multipart.max-request-size 对齐，
    # 否则大图会在 nginx 就被 413 拦掉，运营只看到「上传失败」
    client_max_body_size 16m;
    client_body_timeout  30s;

    root /var/www/hiddenwhite;
    index index.html;

    # -----------------------------------------------------------------
    # 网关头：值从服务器本地文件读取，不进仓库、不进镜像
    # 文件内容形如：set $hw_gateway_secret "…";（示例见 hw-gateway.conf.example）
    # -----------------------------------------------------------------
    include /etc/nginx/hw-gateway.conf;

    # -----------------------------------------------------------------
    # 管理端静态站点（挂在 /admin/ 子路径，与接口同域，省掉跨域白名单）
    # -----------------------------------------------------------------
    location = /admin {
        return 301 /admin/;
    }

    location /admin/ {
        try_files $uri $uri/ /admin/index.html;
    }

    # -----------------------------------------------------------------
    # 唯一开放的后端接口入口
    #
    # 用普通前缀（不是 ^~）：下面的认证限流是正则 location，
    # nginx 只有在前缀未加 ^~ 时才会继续比较正则；
    # 加 ^~ 会让登录入口绕过 hw_auth 限流区。
    # -----------------------------------------------------------------
    location /api/ {
        limit_req zone=hw_api burst=60 nodelay;
        limit_req_status 429;

        proxy_pass http://hiddenwhite_backend;
        proxy_http_version 1.1;
        # keepalive 要求清空 Connection
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 后端据此确认「请求确实经过了本代理」
        proxy_set_header X-HW-Gateway      $hw_gateway_secret;

        proxy_connect_timeout 3s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        # 接口一律不缓存：价格、库存、订单状态变化频繁
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # 认证入口单独收紧：验证码、登录、注册是最容易被脚本盯上的四个端点
    location ~ ^/api/(auth/(login|register)|admin/auth/(login|captcha))$ {
        limit_req zone=hw_auth burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://hiddenwhite_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-HW-Gateway      $hw_gateway_secret;

        proxy_connect_timeout 3s;
        proxy_read_timeout    15s;

        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # -----------------------------------------------------------------
    # 商品图（后端 /uploads/** 静态映射）
    #
    # 用 ^~ ：图片以 .jpg/.png 结尾，普通前缀会被下面的静态资源正则抢走
    # （正则优先于普通前缀），结果去站点根目录找文件 → 404。
    #
    # 反代与后端同机时可改成直接读盘，省一层转发（目录要与后端
    # IMAGE_UPLOAD_DIR 一致）：
    #   location ^~ /uploads/ { alias /opt/hiddenwhite/data/uploads/; expires 7d; }
    # -----------------------------------------------------------------
    location ^~ /uploads/ {
        proxy_pass http://hiddenwhite_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-HW-Gateway      $hw_gateway_secret;

        expires 7d;
    }

    # -----------------------------------------------------------------
    # 静态资源：带 hash 的产物长缓存（index.html 不在此列，见 location /）
    # -----------------------------------------------------------------
    location ~* \.(js|css|woff2?|png|jpe?g|webp|svg)$ {
        try_files $uri =404;
        expires 30d;
    }

    # -----------------------------------------------------------------
    # 点单端 H5（SPA 回退到 index.html）
    # -----------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # -----------------------------------------------------------------
    # 默认拒绝：后端 / Nginx 的运维面不该出现在公网。
    # 即便后端已 denyAll，边缘再拒一次可以省掉一次转发与一条日志噪声。
    # -----------------------------------------------------------------
    location ~ ^/(actuator|error|doc\.html|swagger-ui|swagger-ui\.html|webjars|v3|druid) {
        return 404;
    }

    # 隐藏文件（.git、.env、备份文件）
    location ~ /\.(?!well-known) {
        return 404;
    }

    location ~* \.(sql|bak|log|conf|yml|yaml|properties)$ {
        return 404;
    }

    access_log /var/log/nginx/hiddenwhite.access.log;
    error_log  /var/log/nginx/hiddenwhite.error.log warn;
}
